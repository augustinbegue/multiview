# small shared cache so a refresh-spam does not hammer zevent.fr
proxy_cache_path /tmp/zevent-cache levels=1 keys_zone=zevent:1m max_size=5m inactive=60s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;

    # hashed build output is immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # same-origin proxy for the ZEVENT API (upstream sends no CORS header)
    location = /api/zevent {
        proxy_pass https://zevent.fr/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host zevent.fr;
        proxy_set_header User-Agent "multiview.keepalive.studio";
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_cache zevent;
        proxy_cache_valid 200 20s;
        proxy_cache_lock on;
        add_header Cache-Control "no-store";
        add_header X-Zevent-Cache $upstream_cache_status;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
