# small shared cache so a refresh-spam does not hammer zevent.fr
proxy_cache_path /tmp/zevent-cache levels=1 keys_zone=zevent:1m max_size=5m inactive=60s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json text/plain application/xml;
    gzip_min_length 512;

    # security headers live in an include because add_header in a location
    # replaces (not extends) the server-level set
    include /etc/nginx/conf.d/security-headers.inc;

    # /index.html and /zevent.html must not be indexed as duplicates of the pretty URLs.
    # $request_uri is the client's URI, so the internal try_files rewrite never matches.
    if ($request_uri ~ ^/(fr/)?index\.html(\?|$)) { return 301 /$1$is_args$args; }
    if ($request_uri ~ ^/(fr/)?zevent\.html(\?|$)) { return 301 /$1zevent$is_args$args; }

    # hashed build output is immutable
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- pretty routes for the multi-page build ----
    # /zevent and /fr/zevent are static entries; trailing slashes collapse to the canonical URL
    location = /zevent/  { return 301 /zevent$is_args$args; }
    location = /fr       { return 301 /fr/$is_args$args; }
    location = /fr/zevent/ { return 301 /fr/zevent$is_args$args; }
    location = /zevent {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        add_header Content-Language "en";
        try_files /zevent.html =404;
    }
    location = /fr/zevent {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        add_header Content-Language "fr";
        try_files /fr/zevent.html =404;
    }

    # same-origin proxy for the ZEVENT API (upstream sends no CORS header)
    location = /api/zevent {
        proxy_pass https://zevent.fr/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host zevent.fr;
        proxy_set_header User-Agent "multiview.keepalive.studio";
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_cache zevent;
        proxy_cache_valid 200 20s;
        proxy_cache_lock on;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex" always;
        add_header X-Zevent-Cache $upstream_cache_status;
    }

    # French app: /fr/ and multitwitch-style /fr/chan1/chan2 paths
    location /fr/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        add_header Content-Language "fr";
        try_files $uri /fr/index.html;
    }

    # real files with an extension never fall back to the app (no soft-404s)
    location ~ \.(png|jpe?g|svg|ico|txt|xml|json|webmanifest|css|js|map)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # static SEO files
    location = /robots.txt     { add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap.xml    { add_header Cache-Control "public, max-age=3600"; types { } default_type application/xml; }
    location = /llms.txt       { add_header Cache-Control "public, max-age=3600"; types { } default_type "text/plain; charset=utf-8"; }
    location = /manifest.webmanifest { types { } default_type application/manifest+json; }

    # English app: / and multitwitch-style /chan1/chan2 paths
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        add_header Content-Language "en";
        try_files $uri $uri/ /index.html;
    }
}
