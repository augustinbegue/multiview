<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Multiview</title>
    <meta name="description" content="Twitch multiview switcher laid out like a broadcast control room." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23050607'/%3E%3Crect x='2' y='3' width='8' height='6' fill='%23ff1f1f'/%3E%3Crect x='11' y='3' width='3' height='6' fill='%23232830'/%3E%3Crect x='2' y='10' width='3.4' height='3' fill='%23232830'/%3E%3Crect x='6.3' y='10' width='3.4' height='3' fill='%23232830'/%3E%3C/svg%3E" />
    <script src="https://player.twitch.tv/js/embed/v1.js"></script>
  </head>
  <body>
    <div id="app">
      <header id="bar">
        <span class="bar-mark">MULTIVIEW</span>
        <span id="zevent-badge" class="bar-badge" hidden>ZEVENT</span>
        <span class="bar-hint">1&ndash;9 to switch &nbsp;/&nbsp; click a source</span>
        <span id="zevent-error" class="bar-error" role="alert" hidden></span>
        <div class="bar-actions">
          <span id="zevent-updated" class="bar-updated" hidden></span>
          <button id="zevent-refresh" type="button" class="btn" hidden>refresh channels</button>
          <a id="mode-link" class="btn" href="/zevent">ZEVENT mode</a>
          <button id="mute-all" type="button" class="btn" aria-pressed="false">audio on</button>
          <button id="edit" type="button" class="btn btn-icon" title="Edit channels" aria-label="Edit channels">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M12 8.6A3.4 3.4 0 1 0 12 15.4 3.4 3.4 0 0 0 12 8.6Zm0 5.4a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/><path fill="currentColor" d="m20.3 13.6.1-1.6-.1-1.6 1.7-1.3-1.7-2.9-2 .7a7.9 7.9 0 0 0-2.8-1.6L15.2 3H8.8l-.3 2.3a7.9 7.9 0 0 0-2.8 1.6l-2-.7L2 9.1l1.7 1.3a9.6 9.6 0 0 0 0 3.2L2 14.9l1.7 2.9 2-.7a7.9 7.9 0 0 0 2.8 1.6l.3 2.3h6.4l.3-2.3a7.9 7.9 0 0 0 2.8-1.6l2 .7 1.7-2.9-1.7-1.3ZM12 17.4A5.4 5.4 0 1 1 12 6.6a5.4 5.4 0 0 1 0 10.8Z"/></svg>
          </button>
        </div>
      </header>
      <main id="stage" aria-label="Multiview sources"></main>
      <div id="start" hidden role="button" tabindex="0" aria-label="Start playback">
        <div class="start-label">&#9654; START</div>
        <div class="start-sub">browser blocked autoplay &mdash; click to roll all sources</div>
      </div>
    </div>

    <div id="setup" class="setup" hidden>
      <form id="setup-form" class="setup-card">
        <h1 class="setup-title">Sources</h1>
        <p class="setup-lead">Enter the Twitch channel for each slot. Slot 1 starts on program.</p>
        <div id="slots" class="slots"></div>
        <div class="setup-row">
          <button type="button" id="add-slot" class="btn">Add slot</button>
          <span id="slot-count" class="setup-count"></span>
        </div>
        <p class="setup-lead"><a class="setup-link" href="/zevent">ZEVENT mode &rarr;</a> &mdash; the top 9 ZEVENT streams by viewers, refreshed on demand.</p>
        <p id="setup-error" class="setup-error" role="alert"></p>
        <div class="setup-foot">
          <button type="button" id="setup-cancel" class="btn">Cancel</button>
          <button type="submit" class="btn btn-go">Start multiview</button>
        </div>
      </form>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
