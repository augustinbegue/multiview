        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How do I watch multiple Twitch streams at the same time?",
              "acceptedAnswer": { "@type": "Answer", "text": "Open multiview.keepalive.studio, type one Twitch channel name per slot (2 to 9 channels) and press Start multiview. Every channel plays live at once: the program feed is large with its chat, the others sit in a thumbnail strip. Press 1 to 9 or click a thumbnail to switch which stream is on program and has audio." }
            },
            {
              "@type": "Question",
              "name": "How many Twitch streams can I watch at once?",
              "acceptedAnswer": { "@type": "Answer", "text": "Up to 9 Twitch channels at the same time. Each one keeps playing in its own slot; only the program feed plays audio, the others are muted until you switch to them." }
            },
            {
              "@type": "Question",
              "name": "Can I share my multiview setup with a link?",
              "acceptedAnswer": { "@type": "Answer", "text": "Yes. The channels are written to the URL as ?c=channel1,channel2,channel3 (add &m=2 to pick the program slot and &mute=1 to start muted). Path links like multiview.keepalive.studio/channel1/channel2 also work, the same way as multitwitch-style URLs." }
            },
            {
              "@type": "Question",
              "name": "Is Multiview free and do I need a Twitch account?",
              "acceptedAnswer": { "@type": "Answer", "text": "Multiview is free, open source and needs no account or download. It uses the official Twitch embedded player, so streamers still get their views and ad impressions exactly as on twitch.tv. Log in inside the chat frame if you want to write in chat." }
            },
            {
              "@type": "Question",
              "name": "Does Multiview work for ZEvent?",
              "acceptedAnswer": { "@type": "Answer", "text": "Yes. ZEvent mode at multiview.keepalive.studio/zevent reads the official live list from zevent.fr and puts the 9 most-watched ZEvent streams on screen automatically, with viewer counts on each label and a refresh button." }
            },
            {
              "@type": "Question",
              "name": "What makes Multiview different from multitwitch or kadgar?",
              "acceptedAnswer": { "@type": "Answer", "text": "Instead of an equal grid, Multiview copies a broadcast control room (an ATEM-style multiviewer): one large program feed with chat and a strip of live thumbnails with tally labels. Switching never reloads a player, so streams keep running without buffering. It is available in English and French." }
            }
          ]
        }
