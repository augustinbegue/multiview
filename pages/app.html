    <div id="app">
      <header id="bar">
        <a class="bar-mark" href="{{base}}" aria-label="Multiview home">MULTIVIEW</a>
        <span id="zevent-badge" class="bar-badge" hidden>ZEVENT</span>
        <span class="bar-hint">{{hint}}</span>
        <span id="zevent-error" class="bar-error" role="alert" hidden></span>
        <div class="bar-actions">
          <span id="zevent-updated" class="bar-updated" hidden></span>
          <button id="zevent-refresh" type="button" class="btn" hidden>{{refresh}}</button>
          <a id="mode-link" class="btn" href="{{base}}zevent">{{zeventMode}}</a>
          <a class="btn btn-about" href="#about">{{about}}</a>
          <a id="lang-link" class="btn btn-lang" href="{{alt}}" hreflang="{{altLang}}" lang="{{altLang}}">{{altLabel}}</a>
          <button id="mute-all" type="button" class="btn" aria-pressed="false">{{audioOn}}</button>
          <button id="edit" type="button" class="btn btn-icon" title="{{editTitle}}" aria-label="{{editTitle}}">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M12 8.6A3.4 3.4 0 1 0 12 15.4 3.4 3.4 0 0 0 12 8.6Zm0 5.4a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/><path fill="currentColor" d="m20.3 13.6.1-1.6-.1-1.6 1.7-1.3-1.7-2.9-2 .7a7.9 7.9 0 0 0-2.8-1.6L15.2 3H8.8l-.3 2.3a7.9 7.9 0 0 0-2.8 1.6l-2-.7L2 9.1l1.7 1.3a9.6 9.6 0 0 0 0 3.2L2 14.9l1.7 2.9 2-.7a7.9 7.9 0 0 0 2.8 1.6l.3 2.3h6.4l.3-2.3a7.9 7.9 0 0 0 2.8-1.6l2 .7 1.7-2.9-1.7-1.3ZM12 17.4A5.4 5.4 0 1 1 12 6.6a5.4 5.4 0 0 1 0 10.8Z"/></svg>
          </button>
        </div>
      </header>
      <main id="stage" aria-label="{{stageLabel}}"></main>
    </div>

    <div id="setup" class="setup" hidden>
      <form id="setup-form" class="setup-card">
        <h2 class="setup-title">{{sources}}</h2>
        <p class="setup-lead">{{setupLead}}</p>
        <div id="slots" class="slots"></div>
        <div class="setup-row">
          <button type="button" id="add-slot" class="btn">{{addSlot}}</button>
          <span id="slot-count" class="setup-count"></span>
        </div>
        <p class="setup-lead"><a class="setup-link" href="{{base}}zevent">{{zeventLink}}</a> &mdash; {{zeventLead}}</p>
        <p id="setup-error" class="setup-error" role="alert"></p>
        <div class="setup-foot">
          <button type="button" id="setup-cancel" class="btn">{{cancel}}</button>
          <button type="submit" class="btn btn-go">{{go}}</button>
        </div>
      </form>
    </div>

    <!--#include about-->
